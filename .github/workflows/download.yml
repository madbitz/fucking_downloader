name: Download and chunk file

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the file to download'
        required: true
        type: string
      filename:
        description: 'File name to save as (optional)'
        required: false
        type: string
        default: 'downloaded_file'

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file
        run: |
          URL="${{ github.event.inputs.url }}"
          FILENAME="${{ github.event.inputs.filename }}"
          
          # If no filename given, extract from URL
          if [ "$FILENAME" = "downloaded_file" ]; then
            EXTRACTED=$(basename "$URL" | cut -d'?' -f1)
            if [ -n "$EXTRACTED" ]; then
              FILENAME="$EXTRACTED"
            fi
          fi
          
          echo "Downloading $URL as $FILENAME"
          curl -L --retry 3 -o "$FILENAME" "$URL"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Prepare download folder
        run: |
          FILENAME="${{ env.FILENAME }}"
          # Folder name: safe version of the filename (no spaces/special chars)
          SAFE_DIR=$(echo "$FILENAME" | tr -c 'a-zA-Z0-9._-' '_')
          DEST_DIR="downloads/$SAFE_DIR"
          mkdir -p "$DEST_DIR"
          echo "DEST_DIR=$DEST_DIR" >> $GITHUB_ENV

      - name: Split into numbered parts
        run: |
          FILENAME="${{ env.FILENAME }}"
          DEST_DIR="${{ env.DEST_DIR }}"
          MAX_SIZE=94371840   # 90 MB
          
          SIZE=$(stat -c%s "$FILENAME")
          echo "File size: $SIZE bytes"
          
          if [ "$SIZE" -le "$MAX_SIZE" ]; then
            # Just move the file directly
            mv "$FILENAME" "$DEST_DIR/"
            echo "File is small enough, stored directly."
            exit 0
          fi
          
          # --- Large file: split into numbered parts ---
          
          # Detect if the file is a .zip to use multi-part ZIP naming
          EXT="${FILENAME##*.}"
          LOWERCASE_EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
          
          if [ "$LOWERCASE_EXT" = "zip" ]; then
            # Multi-part ZIP naming: .z01, .z02, ..., .zip (last part is .zip)
            PREFIX="${FILENAME%.*}"   # name without extension
            split -b "$MAX_SIZE" -d --additional-suffix=".zip_tmp" "$FILENAME" "${DEST_DIR}/${PREFIX}_part"
            
            # Rename parts: first ones become .z01, .z02... last one becomes .zip
            PARTS=($(ls -1 "${DEST_DIR}/${PREFIX}_part"* | sort))
            TOTAL=${#PARTS[@]}
            COUNT=1
            for PART in "${PARTS[@]}"; do
              if [ $COUNT -lt $TOTAL ]; then
                # intermediate parts: .z01, .z02, ...
                NUM=$(printf "%02d" $COUNT)
                mv "$PART" "${DEST_DIR}/${PREFIX}.z${NUM}"
              else
                # last part: .zip
                mv "$PART" "${DEST_DIR}/${PREFIX}.zip"
              fi
              COUNT=$((COUNT + 1))
            done
            
          else
            # Generic numbering: filename.part001, filename.part002 ...
            split -b "$MAX_SIZE" -d --additional-suffix=".partchunk" "$FILENAME" "${DEST_DIR}/${FILENAME}_chunk"
            PARTS=($(ls -1 "${DEST_DIR}/${FILENAME}_chunk"* | sort))
            COUNT=1
            for PART in "${PARTS[@]}"; do
              NUM=$(printf "%03d" $COUNT)
              mv "$PART" "${DEST_DIR}/${FILENAME}.part${NUM}"
              COUNT=$((COUNT + 1))
            done
          fi
          
          # Remove the original large file
          rm "$FILENAME"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Download: ${{ env.FILENAME }} (chunked)" || echo "Nothing to commit"
          git push
